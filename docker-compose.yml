version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tendermind
      POSTGRES_USER: tendermind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tendermind123}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendermind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A crawler.tasks worker --loglevel=info --concurrency=4

  beat:
    build: ./backend
    env_file: .env
    depends_on:
      - worker
    volumes:
      - ./backend:/app
    command: celery -A crawler.tasks beat --loglevel=info --scheduler celery.beat.PersistentScheduler

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
